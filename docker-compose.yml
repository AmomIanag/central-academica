services:
  postgres:
    image: postgres:16-alpine
    container_name: central-academica-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: central
      POSTGRES_PASSWORD: central
      POSTGRES_DB: central_academica
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central -d central_academica"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
